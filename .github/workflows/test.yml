name: Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Agentbase/**'
      - 'README.md'
      - 'README.en.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Bagimliklar
        working-directory: Agentbase
        run: npm install

      - name: Testler
        working-directory: Agentbase
        run: npm test
