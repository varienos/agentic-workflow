# Extensions Registry — Agentic Workflow
#
# After project analysis, Bootstrap scans this pool and recommends matching extensions.
# Bootstrap does NOT install — it only recommends.
#
# To add a new extension, use the format below:
#
#   - name: "Extension Name"
#     repo: "github-user/repo-name"
#     url: "https://github.com/..."
#     agent: claude | gemini | codex | all
#     category: security | workflow | multi-agent | memory | quality | devops | management
#     install: "npm i -g package-name"  # or another install command
#     description: "One-line description"
#     triggers:                       # When to recommend this extension
#       - module: module-name         # Active module match
#       - stack: [tech1, tech2]       # Stack match (any one)
#       - condition: "field > value"  # Manifest field check
#     conflicts:                      # Conflicts with Agentbase features
#       - feature: "feature-name"
#         note: "Conflict explanation"

extensions:

  # ─── SECURITY ───

  - name: "Trail of Bits Security"
    repo: "trailofbits/skills"
    url: "https://github.com/trailofbits/skills"
    agent: claude
    category: security
    install: "Clone the repo and add the skill path to CLAUDE.md"
    description: "Professional skill collection for security research and vulnerability detection"
    triggers:
      - module: security
      - stack: [express, django, laravel, fastapi, nestjs]
      - condition: "project.security_level == high"
      - condition: "project.security_level == critical"
    conflicts: []

  - name: "Security Scanner"
    repo: "harish-garg/security-scanner-plugin"
    url: "https://github.com/harish-garg/security-scanner-plugin"
    agent: claude
    category: security
    install: "npm i -g @harish-garg/security-scanner-plugin"
    description: "Vulnerability scanning using GitHub data"
    triggers:
      - condition: "project.security_level == high"
      - condition: "project.security_level == critical"
    conflicts: []

  - name: "Parry"
    repo: "vaporif/parry"
    url: "https://github.com/vaporif/parry"
    agent: claude
    category: security
    install: "npm i -g parry"
    description: "Prompt-injection scanner, data-leak detection"
    triggers:
      - condition: "project.security_level == critical"
    conflicts: []

  # ─── MULTI-AGENT ───

  - name: "Claude Squad"
    repo: "smtg-ai/claude-squad"
    url: "https://github.com/smtg-ai/claude-squad"
    agent: claude
    category: multi-agent
    install: "npm i -g claude-squad"
    description: "Manage multiple Claude Code instances in tmux"
    triggers:
      - module: monorepo
      - condition: "project.subprojects.length >= 3"
    conflicts: []

  - name: "Parallel Code"
    repo: "johannesjo/parallel-code"
    url: "https://github.com/johannesjo/parallel-code"
    agent: all
    category: multi-agent
    install: "npm i -g parallel-code"
    description: "Run Claude, Codex, and Gemini side by side in separate worktrees"
    triggers:
      - module: monorepo
      - condition: "project.subprojects.length >= 2"
    conflicts: []

  - name: "ccswarm"
    repo: "nwiizo/ccswarm"
    url: "https://github.com/nwiizo/ccswarm"
    agent: claude
    category: multi-agent
    install: "npm i -g ccswarm"
    description: "Multi-agent orchestration with git worktree isolation"
    triggers:
      - module: monorepo
    conflicts: []

  # ─── MEMORY / CONTEXT ───


  - name: "Memorix"
    repo: "AVIDS2/memorix"
    url: "https://github.com/AVIDS2/memorix"
    agent: all
    category: memory
    install: "npm i -g memorix"
    description: "Shared memory across agents — MCP-based"
    triggers:
      - condition: "project.team_size == large-team"
    conflicts: []

  - name: "Graphify"
    repo: "safishamsi/graphify"
    url: "https://github.com/safishamsi/graphify"
    agent: all
    category: memory
    install: "Clone the repo and add the skill path to CLAUDE.md"
    description: "Skill that turns any folder (code, docs, images, video) into a queryable knowledge graph"
    triggers:
      - condition: "project.team_size == large-team"
      - condition: "project.type == monorepo"
      - condition: "project.subprojects.length >= 3"
    conflicts: []

  - name: "RTK (Rust Token Killer)"
    repo: "rtk-ai/rtk"
    url: "https://github.com/rtk-ai/rtk"
    agent: all
    category: memory
    install: "Follow the install instructions in the repo (Rust binary). Hook-based — automatically rewrites Claude Code bash calls."
    description: "CLI proxy that rewrites bash commands (git, ls, cat, etc.) via hooks for ~60-90% token savings on dev operations"
    triggers:
      - condition: "project.team_size == large-team"
      - condition: "project.type == monorepo"
      - condition: "project.subprojects.length >= 3"
    conflicts: []

  # ─── WORKFLOW ───

  - name: "Claude CodePro"
    repo: "maxritter/claude-codepro"
    url: "https://github.com/maxritter/claude-codepro"
    agent: claude
    category: workflow
    install: "Clone the repo and integrate into CLAUDE.md"
    description: "Spec-driven workflow and TDD enforcement"
    triggers:
      - condition: "workflows.test_strategy == tdd"
    conflicts:
      - feature: "task-hunter TDD/Red-Green modifier"
        note: "Agentbase task-hunter already includes a TDD modifier. Double enforcement may be unnecessary."

  # ─── CODE QUALITY ───

  - name: "cc-tools"
    repo: "Veraticus/cc-tools"
    url: "https://github.com/Veraticus/cc-tools"
    agent: claude
    category: quality
    install: "go install github.com/Veraticus/cc-tools@latest"
    description: "High-performance hooks written in Go"
    triggers:
      - stack: [go]
    conflicts: []

  - name: "Claude Code Action"
    repo: "anthropics/claude-code-action"
    url: "https://github.com/anthropics/claude-code-action"
    agent: claude
    category: quality
    install: "Add to a GitHub Actions workflow file"
    description: "Official GitHub Action — PR review, security audit"
    triggers:
      - module: github-actions
      - condition: "project.team_size == small-team"
      - condition: "project.team_size == large-team"
    conflicts: []

  # ─── DEVOPS ───

  - name: "Container Use"
    repo: "dagger/container-use"
    url: "https://github.com/dagger/container-use"
    agent: all
    category: devops
    install: "npm i -g container-use"
    description: "Secure container development environments"
    triggers:
      - module: docker
    conflicts: []

  # ─── PROJECT MANAGEMENT ───

  - name: "CCPM"
    repo: "automazeio/ccpm"
    url: "https://github.com/automazeio/ccpm"
    agent: claude
    category: management
    install: "npm i -g ccpm"
    description: "Parallel agent management with GitHub Issues + worktrees"
    triggers:
      - module: github-actions
      - condition: "project.team_size == large-team"
    conflicts:
      - feature: "Backlog.md CLI"
        note: "Agentbase already manages tasks with Backlog.md. CCPM uses a separate task system."
